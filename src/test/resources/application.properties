spring.config.import=optional:file:.env[.properties]

spring.application.name=techstars

# Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Database Export Configuration
app.db.export.pg_dump_path=pg_dump

# Google Sheets Configuration
google.sheets.credentials.content=${GOOGLE_CREDENTIALS_JSON}
google.sheets.spreadsheet.id=${GOOGLE_SPREADSHEET_ID}

